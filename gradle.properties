# Project-wide Gradle settings.

# JVM heap for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Required: this project uses AndroidX libraries exclusively.
android.useAndroidX=true

# Generates a separate, non-transitive R class per module — faster incremental builds.
android.nonTransitiveRClass=true

# Enable Gradle parallel project execution and configuration caching where supported.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# Use the AndroidX Jetifier only if you later add an old support-library dependency.
android.enableJetifier=false
